<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Loud Ads — Manager</title><link rel="stylesheet" href="admin.css"></head><body><!-- =========================
     ADMIN HEADER
========================= --><header class="admin-header"><div class="admin-brand">
    <span>LOUD</span>
    <small>ADS MANAGER</small>
</div>

<button class="preview-btn" type="button">
    VIEW SITE
</button>

</header><!-- =========================
     DASHBOARD
========================= --><main class="admin-dashboard"><!-- =========================
     DASHBOARD INTRO
========================= -->

<section class="dashboard-intro">

    <span class="section-label">CONTROL CENTRE</span>

    <h1>
        Manage<br>
        Your Site.
    </h1>

    <p>
        Update your Loud Ads images, links and portfolio projects without editing your website code.
    </p>

</section>


<!-- =========================
     PAGE SELECTOR
========================= -->

<section class="page-selector">

    <button class="page-tab active" data-page="landing" type="button">
        <span>01</span>
        LANDING PAGE
    </button>

    <button class="page-tab" data-page="portfolio" type="button">
        <span>02</span>
        PORTFOLIO
    </button>

</section>


<!-- =========================
     LANDING PAGE
========================= -->

<section class="admin-page active" id="landing-page">

    <div class="page-heading">

        <div>
            <span class="section-label">LANDING PAGE</span>
            <h2>Featured Content</h2>
        </div>

        <span class="item-count">03 ITEMS</span>

    </div>


    <!-- FEATURED AD 01 -->

    <article class="content-card">

        <div class="content-number">01</div>

        <div class="image-preview">
            <img src="images/business-ad-1.jpg" alt="Featured Ad 1">
        </div>

        <div class="content-details">

            <label>
                IMAGE
                <input
                    type="file"
                    class="image-input"
                    accept="image/*"
                >
            </label>

            <label>
                ADVERTISER LINK
                <input
                    type="url"
                    class="link-input"
                    value=""
                    placeholder="https://instagram.com/..."
                >
            </label>

            <label>
                LABEL
                <input
                    type="text"
                    value="FEATURED"
                    placeholder="FEATURED"
                >
            </label>

            <button class="save-btn" type="button">
                SAVE CHANGES
            </button>

        </div>

    </article>


    <!-- FEATURED AD 02 -->

    <article class="content-card">

        <div class="content-number">02</div>

        <div class="image-preview">
            <img src="images/business-ad-2.jpg" alt="Featured Ad 2">
        </div>

        <div class="content-details">

            <label>
                IMAGE
                <input
                    type="file"
                    class="image-input"
                    accept="image/*"
                >
            </label>

            <label>
                ADVERTISER LINK
                <input
                    type="url"
                    class="link-input"
                    placeholder="https://instagram.com/..."
                >
            </label>

            <label>
                LABEL
                <input
                    type="text"
                    value="PROMOTION"
                    placeholder="PROMOTION"
                >
            </label>

            <button class="save-btn" type="button">
                SAVE CHANGES
            </button>

        </div>

    </article>


    <!-- FEATURED AD 03 -->

    <article class="content-card">

        <div class="content-number">03</div>

        <div class="image-preview">
            <img src="images/business-ad-3.jpg" alt="Featured Ad 3">
        </div>

        <div class="content-details">

            <label>
                IMAGE
                <input
                    type="file"
                    class="image-input"
                    accept="image/*"
                >
            </label>

            <label>
                ADVERTISER LINK
                <input
                    type="url"
                    class="link-input"
                    placeholder="https://instagram.com/..."
                >
            </label>

            <label>
                LABEL
                <input
                    type="text"
                    value="EVENT"
                    placeholder="EVENT"
                >
            </label>

            <button class="save-btn" type="button">
                SAVE CHANGES
            </button>

        </div>

    </article>

</section>


<!-- =========================
     PORTFOLIO
========================= -->

<section class="admin-page" id="portfolio-page">

    <div class="page-heading">

        <div>
            <span class="section-label">PORTFOLIO</span>
            <h2>Your Projects</h2>
        </div>

        <span class="item-count">PROJECTS</span>

    </div>


    <!-- PORTFOLIO PROJECT 01 -->

    <article class="portfolio-card">

        <div class="portfolio-number">01</div>

        <div class="portfolio-preview">

            <img
                src="images/Rob 3.png"
                alt="Portfolio Project 1"
            >

        </div>

        <div class="portfolio-details">

            <label>
                PROJECT IMAGE
                <input
                    type="file"
                    class="portfolio-image-input"
                    accept="image/*"
                >
            </label>

            <label>
                PROJECT NAME
                <input
                    type="text"
                    value=""
                    placeholder="Project name"
                >
            </label>

            <label>
                PROJECT LINK
                <input
                    type="url"
                    placeholder="https://..."
                >
            </label>

            <button class="save-btn" type="button">
                SAVE PROJECT
            </button>

        </div>

    </article>


    <!-- PORTFOLIO PROJECT 02 -->

    <article class="portfolio-card">

        <div class="portfolio-number">02</div>

        <div class="portfolio-preview">

            <img
                src="images/Jeff cuts 3.png"
                alt="Portfolio Project 2"
            >

        </div>

        <div class="portfolio-details">

            <label>
                PROJECT IMAGE
                <input
                    type="file"
                    class="portfolio-image-input"
                    accept="image/*"
                >
            </label>

            <label>
                PROJECT NAME
                <input
                    type="text"
                    value=""
                    placeholder="Project name"
                >
            </label>

            <label>
                PROJECT LINK
                <input
                    type="url"
                    placeholder="https://..."
                >
            </label>

            <button class="save-btn" type="button">
                SAVE PROJECT
            </button>

        </div>

    </article>


    <!-- PORTFOLIO PROJECT 03 -->

    <article class="portfolio-card">

        <div class="portfolio-number">03</div>

        <div class="portfolio-preview">

            <img
                src="images/dash pic.png"
                alt="Portfolio Project 3"
            >

        </div>

        <div class="portfolio-details">

            <label>
                PROJECT IMAGE
                <input
                    type="file"
                    class="portfolio-image-input"
                    accept="image/*"
                >
            </label>

            <label>
                PROJECT NAME
                <input
                    type="text"
                    value=""
                    placeholder="Project name"
                >
            </label>

            <label>
                PROJECT LINK
                <input
                    type="url"
                    placeholder="https://..."
                >
            </label>

            <button class="save-btn" type="button">
                SAVE PROJECT
            </button>

        </div>

    </article>


    <!-- ADD PROJECT -->

    <button class="add-project-btn" type="button">
        + ADD NEW PROJECT
    </button>

</section>

</main><!-- =========================
     FOOTER
========================= --><footer class="admin-footer"><span>LOUD ADS PTY LTD</span>

<span>CONTENT MANAGER</span>

</footer><script src="admin.js"></script></body>
                 </html>
